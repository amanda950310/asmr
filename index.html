<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASMR助眠｜沉浸式放松解压视频 快速入睡</title>
  <meta name="keywords" content="ASMR,助眠ASMR,放松ASMR,解压ASMR,耳语ASMR,口腔音ASMR,触发音ASMR,深度睡眠ASMR,失眠助眠,沉浸式助眠,敲击音ASMR,缓解焦虑,睡前放松,治愈系ASMR,刮擦音ASMR,耳边低语,哄睡音频">
  <meta name="description" content="高质量ASMR助眠视频，提供沉浸式耳语、口腔音、触发音，帮助快速入睡、缓解失眠焦虑、舒缓压力，适合睡前放松解压。">
  <meta name="robots" content="index,follow">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
    }
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: #ffffff;
      padding: 16px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 999;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #8b5cf6;
      cursor: pointer;
    }
    .admin-link {
      padding: 6px 14px;
      background: #8b5cf6;
      color: #fff;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
    }
    .search-container {
      padding: 10px 5%;
      margin-top: 80px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .search-box input {
      background: #f1f5f9;
      border: none;
      outline: none;
      padding: 8px 14px;
      border-radius: 20px;
      color: #1e293b;
      width: 100%;
      max-width: 500px;
    }
    .container {
      margin-top: 20px;
      padding: 0 5%;
    }
    .section-title {
      font-size: 22px;
      margin: 30px 0 16px;
      border-left: 4px solid #8b5cf6;
      padding-left: 10px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .video-card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .video-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }
    .video-cover {
      width: 100%;
      height: 115px;
      object-fit: cover;
      display: block;
    }
    .video-info {
      padding: 12px;
    }
    .video-title {
      font-size: 14px;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-meta {
      font-size: 12px;
      color: #64748b;
    }
    .empty-tip{
      text-align:center;
      padding:40px;
      color:#94a3b8;
    }
    @media (max-width: 768px) {
      .video-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .search-box input {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">耳语ASMR</div>
    <a href="javascript:;" class="admin-link" onclick="goToAdmin()">后台管理</a>
  </header>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="search" placeholder="搜索ASMR音频视频..." oninput="searchVideo()" />
    </div>
  </div>

  <div class="container">
    <h2 class="section-title">ASMR 助眠合集</h2>
    <div class="video-grid" id="videoList"></div>
  </div>

  <script>
    let videos = [];
    const videoList = document.getElementById("videoList");

    // 读取服务器 video_list.json
    async function loadVideos() {
      try {
        const res = await fetch("./video_list.json");
        videos = await res.json();
        renderVideo(videos);
      } catch (e) {
        videoList.innerHTML = '<div class="empty-tip">暂无视频，请前往后台添加</div>';
      }
    }

    function renderVideo(list) {
      videoList.innerHTML = "";
      if (!list || list.length === 0) {
        videoList.innerHTML = '<div class="empty-tip">暂无视频，请前往后台添加</div>';
        return;
      }
      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
          <img src="${item.cover || 'https://picsum.photos/id/237/400/225'}" class="video-cover" alt="${item.title}">
          <div class="video-info">
            <div class="video-title">${item.title}</div>
            <div class="video-meta">ASMR · 助眠放松</div>
          </div>
        `;
        card.onclick = () => {
          localStorage.setItem("playItem", JSON.stringify(item));
          location.href = "play.html";
        };
        videoList.appendChild(card);
      });
    }

    function searchVideo() {
      const key = document.getElementById("search").value.toLowerCase();
      const filtered = videos.filter(v => v.title.toLowerCase().includes(key));
      renderVideo(filtered);
    }

    function goToAdmin() {
      const pwd = prompt("后台密码：");
      if (pwd === "aa123123") location.href = "admin.html";
      else alert("密码错误");
    }

    window.onload = loadVideos;
  </script>
</body>
</html>
