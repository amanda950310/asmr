<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASMR助眠｜沉浸式放松解压视频 快速入睡</title>
  <meta name="keywords" content="ASMR,助眠ASMR,放松ASMR,解压ASMR,耳语ASMR,口腔音ASMR,触发音ASMR,深度睡眠ASMR,失眠助眠,沉浸式助眠,敲击音ASMR,缓解焦虑,睡前放松,治愈系ASMR,刮擦音ASMR,耳边低语,哄睡音频">
  <meta name="description" content="高质量ASMR助眠视频，提供沉浸式耳语、口腔音、触发音，帮助快速入睡、缓解失眠焦虑、舒缓压力，适合睡前放松解压。">
  <meta name="robots" content="index,follow">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f4f4f5;
      color: #18191c;
      min-height: 100vh;
    }
    /* 全局变量 B站色 */
    :root {
      --bili-pink: #fb7299;
      --bili-blue: #00a1d6;
      --bili-gray: #9499a0;
      --bili-light: #f1f2f3;
      --bili-border: #e3e5e7;
    }
    /* 顶部导航 */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: #ffffff;
      padding: 12px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 999;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      border-bottom: 1px solid var(--bili-border);
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: var(--bili-pink);
      cursor: pointer;
    }
    .admin-link {
      padding: 6px 16px;
      background: var(--bili-pink);
      color: #fff;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }
    .admin-link:hover {
      background: #f16690;
    }
    /* 搜索栏 */
    .search-container {
      padding: 15px 5%;
      margin-top: 68px;
      background: #ffffff;
      border-bottom: 1px solid var(--bili-border);
    }
    .search-box {
      display: flex;
      align-items: center;
      max-width: 500px;
    }
    .search-box input {
      width: 100%;
      height: 36px;
      background: var(--bili-light);
      border: 1px solid var(--bili-border);
      outline: none;
      padding: 0 15px;
      border-radius: 18px 0 0 18px;
      font-size: 14px;
      color: #18191c;
    }
    .search-box input:focus {
      background: #fff;
      border-color: var(--bili-pink);
    }
    .search-box button {
      height: 36px;
      width: 70px;
      background: var(--bili-pink);
      color: white;
      border: none;
      border-radius: 0 18px 18px 0;
      cursor: pointer;
      font-size: 14px;
    }
    .search-box button:hover {
      background: #f16690;
    }
    /* 主容器 */
    .main-wrap {
      padding: 0 5%;
      max-width: 1400px;
      margin: 0 auto;
    }
    /* 横向可滑动排行榜，在视频上方 */
    .hot-rank-wrap {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .hot-title {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 12px;
      color: #222;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hot-title::before {
      content: '🔥';
    }
    .hot-list {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .hot-list::-webkit-scrollbar {
      height: 4px;
    }
    .hot-list::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 2px;
    }
    .rank-card {
      min-width: 180px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .rank-card:hover {
      transform: translateY(-3px);
    }
    .rank-cover {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }
    .rank-info {
      margin-top: 6px;
    }
    .rank-title {
      font-size: 13px;
      color: #18191c;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rank-play {
      font-size: 11px;
      color: var(--bili-gray);
      margin-top: 2px;
    }
    .rank-num {
      position: absolute;
      background: var(--bili-pink);
      color: #fff;
      font-size: 12px;
      width: 20px;
      height: 20px;
      text-align: center;
      line-height: 20px;
      border-radius: 50%;
      margin-top: -106px;
      margin-left: 4px;
    }
    /* 分区标题 */
    .section-title {
      font-size: 18px;
      font-weight: 500;
      margin: 25px 0 15px;
      padding-left: 10px;
      border-left: 4px solid var(--bili-pink);
      color: #18191c;
    }
    /* 视频网格 */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px 18px;
    }
    /* B站标准视频卡片 */
    .video-card {
      background: transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .video-card:hover {
      transform: translateY(-4px);
    }
    .cover-box {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-cover {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
    }
    /* 卡片角标 */
    .card-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .video-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .video-info {
      padding: 10px 4px;
    }
    .video-title {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #18191c;
      font-weight: 500;
    }
    .video-owner {
      font-size: 12px;
      color: var(--bili-gray);
      margin-bottom: 4px;
    }
    .video-data {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--bili-gray);
    }
    .empty-tip{
      text-align:center;
      padding:60px 20px;
      color:var(--bili-gray);
      font-size:14px;
    }
    /* 页脚 */
    footer {
      margin-top: 40px;
      padding: 30px 5%;
      background: #fff;
      text-align: center;
      font-size: 13px;
      color: var(--bili-gray);
      border-top: 1px solid var(--bili-border);
    }
    /* 移动端适配 */
    @media (max-width: 768px) {
      .video-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 18px 12px;
      }
      .video-cover {
        height: 105px;
      }
      .search-box {
        max-width: 100%;
      }
      .hot-list {
        gap: 10px;
      }
      .rank-card {
        min-width: 140px;
      }
      .rank-cover {
        height: 80px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">耳语ASMR</div>
    <button class="admin-link" onclick="goToAdmin()">后台管理</button>
  </header>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="search" placeholder="搜索ASMR音频视频..." oninput="searchVideo()" />
      <button onclick="searchVideo()">搜索</button>
    </div>
  </div>

  <div class="main-wrap">
    <div class="hot-rank-wrap">
      <div class="hot-title">热度排行</div>
      <div class="hot-list" id="hotRankList"></div>
    </div>

    <h2 class="section-title">ASMR 助眠合集</h2>
    <div class="video-grid" id="videoList"></div>
  </div>

  <footer>
    © 2026 耳语ASMR｜专注沉浸式助眠放松｜所有内容仅供放松解压
  </footer>

  <script>
    let videos = [];
    const videoList = document.getElementById("videoList");
    const hotRankList = document.getElementById("hotRankList");

    // 初始化播放量本地存储
    function initPlayCount() {
      if (!localStorage.getItem("videoPlayCount")) {
        localStorage.setItem("videoPlayCount", JSON.stringify({}));
      }
    }

    // 获取单个视频播放量
    function getPlayCount(vid) {
      const data = JSON.parse(localStorage.getItem("videoPlayCount"));
      return data[vid] || 0;
    }

    // 增加播放量（仅点击播放时 +1）
    function addPlayCount(vid) {
      const data = JSON.parse(localStorage.getItem("videoPlayCount"));
      data[vid] = (data[vid] || 0) + 1;
      localStorage.setItem("videoPlayCount", JSON.stringify(data));
    }

    // 更新热度排行（横向可滑动）
    function updateHotRank(list) {
      const sorted = [...list].sort((a, b) => getPlayCount(b.id) - getPlayCount(a.id)).slice(0,5);
      hotRankList.innerHTML = "";
      sorted.forEach((item,idx)=>{
        const playNum = getPlayCount(item.id);
        const div = document.createElement("div");
        div.className = "rank-card";
        div.innerHTML = `
          <span class="rank-num">${idx+1}</span>
          <img src="${item.cover || 'https://picsum.photos/id/237/400/225'}" class="rank-cover" alt="${item.title}">
          <div class="rank-info">
            <div class="rank-title">${item.title}</div>
            <div class="rank-play">▶ ${playNum.toLocaleString()}</div>
          </div>
        `;
        div.onclick = ()=>{
          addPlayCount(item.id);
          localStorage.setItem("playItem", JSON.stringify(item));
          location.href = "play.html";
        };
        hotRankList.appendChild(div);
      })
    }

    async function loadVideos() {
      initPlayCount();
      try {
        const res = await fetch("./video_list.json");
        if (!res.ok) {
          videoList.innerHTML = '<div class="empty-tip">暂无视频，请前往后台添加</div>';
          return;
        }
        videos = await res.json();
        renderVideo(videos);
        updateHotRank(videos);
      } catch (e) {
        videoList.innerHTML = '<div class="empty-tip">暂无视频，请前往后台添加</div>';
      }
    }

    function renderVideo(list) {
      videoList.innerHTML = "";
      if (!list || list.length === 0) {
        videoList.innerHTML = '<div class="empty-tip">暂无视频，请前往后台添加</div>';
        return;
      }
      list.forEach(item => {
        if(!item.id) item.id = Date.now() + Math.floor(Math.random()*1000);
        const playNum = getPlayCount(item.id);
        const randomTime = Math.floor(Math.random()*3600);
        const min = Math.floor(randomTime/60);
        const sec = randomTime%60;
        const timeStr = `${min}:${sec.toString().padStart(2,'0')}`;
        const danmu = Math.floor(Math.random()*2000);
        const owner = item.owner || "ASMR助眠馆";

        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
          <div class="cover-box">
            <img src="${item.cover || 'https://picsum.photos/id/237/400/225'}" class="video-cover" alt="${item.title}">
            <span class="card-badge">精选</span>
            <span class="video-duration">${timeStr}</span>
          </div>
          <div class="video-info">
            <div class="video-title">${item.title}</div>
            <div class="video-owner">${owner}</div>
            <div class="video-data">
              <span>▶ ${playNum.toLocaleString()}</span>
              <span>💬 ${danmu}</span>
            </div>
          </div>
        `;
        card.onclick = () => {
          addPlayCount(item.id);
          localStorage.setItem("playItem", JSON.stringify(item));
          location.href = "play.html";
        };
        videoList.appendChild(card);
      });
    }

    function searchVideo() {
      const key = document.getElementById("search").value.toLowerCase();
      const filtered = videos.filter(v => v.title.toLowerCase().includes(key));
      renderVideo(filtered);
      updateHotRank(filtered);
    }

    function goToAdmin() {
      const pwd = prompt("后台密码：");
      if (pwd === "aa123123") location.href = "admin.html";
      else alert("密码错误");
    }

    window.onload = loadVideos;
  </script>
</body>
</html>
